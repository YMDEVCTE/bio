<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050508">
<title>YM DEV | YMDEVCTE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06060a; --text:#fff; --dim:#a0a0b0;
  --glass:rgba(255,255,255,.04); --line:rgba(255,255,255,.12); --hover:rgba(255,255,255,.09);
  --accent:#00b3ff; --b1:#ff2a5f; --b2:#00b3ff; --b3:#b24bff;
}
:root[data-theme="light"]{
  --bg:#f4f4f8; --text:#1a1a24; --dim:#666;
  --glass:rgba(255,255,255,.6); --line:rgba(0,0,0,.12); --hover:rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Montserrat',system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Nền: 3 blob tĩnh + blur, nhẹ hơn canvas hạt */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;filter:blur(90px);opacity:.35;pointer-events:none}
.bg i{position:absolute;border-radius:50%;animation:float 25s infinite alternate ease-in-out}
.bg i:nth-child(1){background:var(--b1);width:50vw;height:50vw;top:-10%;left:-10%}
.bg i:nth-child(2){background:var(--b2);width:45vw;height:45vw;bottom:-10%;right:-10%;animation-delay:-8s}
.bg i:nth-child(3){background:var(--b3);width:35vw;height:35vw;top:40%;left:40%;animation-delay:-15s}
@keyframes float{to{transform:translate(8vw,8vh) scale(1.25)}}

.wrap{max-width:480px;margin:0 auto;padding:28px 16px 60px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:32px;padding:22px 18px;backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);box-shadow:0 24px 50px rgba(0,0,0,.25)}

/* Top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:18px}
.pill,.ibtn,.lang{background:var(--glass);border:1px solid var(--line);border-radius:14px}
.pill{padding:7px 12px;font-size:11px;font-weight:700}
.tools{display:flex;gap:6px;align-items:center}
.ibtn{width:34px;height:34px;display:grid;place-items:center;cursor:pointer;font-size:14px;transition:.2s}
.ibtn:hover{background:var(--hover)}
.ibtn[aria-pressed="true"]{border-color:#00ff96;background:rgba(0,255,150,.15)}
.lang{display:flex;padding:2px}
.lang button{border:0;background:none;font-size:10px;font-weight:800;padding:6px 8px;border-radius:10px;cursor:pointer;color:var(--dim)}
.lang button.on{background:var(--hover);color:var(--text)}

/* Hero */
.hero{text-align:center;display:grid;gap:8px;justify-items:center;margin-bottom:20px}
.avatar{width:96px;height:96px;border-radius:50%;border:3px solid var(--line);object-fit:cover;background:#1a1a24}
.badge{font-size:11px;font-weight:700;color:var(--dim)}
.badge b{color:var(--accent)}
h1{font-family:'Space Grotesk',sans-serif;font-size:30px;letter-spacing:2px}
.sub{font-size:10px;letter-spacing:5px;color:var(--dim);font-weight:700}

/* Search */
.search{position:relative;margin-bottom:12px}
.search input{width:100%;padding:14px 64px 14px 42px;border-radius:16px;border:1px solid var(--line);background:var(--glass);outline:none;font-size:14px;transition:border-color .2s}
.search input:focus{border-color:var(--accent)}
.search .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.7}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
@media (hover:none){.search kbd{display:none}.search input{padding-right:14px}}

/* Categories */
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:12px;font-weight:700;cursor:pointer;color:var(--dim);transition:.2s}
.chip:hover{color:var(--text)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip small{opacity:.6;margin-left:4px;font-weight:500}

/* List */
.group-title{font-size:12px;font-weight:800;color:var(--dim);margin:16px 4px 8px}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--glass);text-decoration:none;color:inherit;cursor:pointer;text-align:left;width:100%;transition:background .2s,transform .2s,border-color .2s}
.item:hover{background:var(--hover);transform:translateX(3px);border-color:var(--c,var(--line))}
.item .ico{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c,#888) 18%,transparent)}
.item .txt{flex:1;min-width:0}
.item .name{font-size:14px;font-weight:700}
.item .desc{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tag{flex:none;font-size:10px;font-weight:700;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:3px 7px}
.empty{text-align:center;color:var(--dim);font-size:13px;padding:30px 0}

/* Tuyết */
#snow{position:fixed;inset:0;z-index:-1;pointer-events:none}

/* Animation */
.card{animation:rise .8s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.97)}}
.card::after{content:'';position:absolute;inset:0;border-radius:32px;pointer-events:none;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.07) 50%,transparent 70%);background-size:250% 250%;animation:sheen 7s linear infinite}
@keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}
.card{position:relative}
.avatar-wrap{position:relative;width:104px;height:104px;display:grid;place-items:center;animation:bob 4s ease-in-out infinite}
.avatar-wrap::before{content:'';position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,transparent,#00b3ff,transparent,#b24bff,transparent);animation:spin 5s linear infinite;filter:blur(2px)}
.avatar-wrap .avatar{position:relative;width:96px;height:96px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-6px)}}
h1{background:linear-gradient(90deg,var(--text) 0%,#00b3ff 25%,#b24bff 50%,#ff2a5f 75%,var(--text) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 6s linear infinite}
@keyframes shimmer{to{background-position:-250% 0}}
.hero>*:not(.avatar-wrap){animation:fadeUp .7s .15s cubic-bezier(.16,1,.3,1) both}
.hero>.badge{animation-delay:.25s}.hero>h1{animation-delay:.35s}.hero>.sub{animation-delay:.45s}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
.stagger .item,.stagger .group-title{animation:itemIn .55s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0)*55ms + 250ms)}
@keyframes itemIn{from{opacity:0;transform:translateX(-18px) scale(.97)}}
.item{position:relative;overflow:hidden}
.item::after{content:'';position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-20deg);transition:left .6s}
.item:hover::after{left:130%}
.item:active{transform:scale(.98)}
.item .ico{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.item:hover .ico{transform:scale(1.18) rotate(-8deg)}
.chip.on{animation:pop2 .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop2{from{transform:scale(.88)}}
.copy-btn{position:relative;overflow:hidden}
.copy-btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:btnshine 3s 1s infinite}
@keyframes btnshine{to{left:140%}}
.steps li{animation:fadeUp .5s both}
.steps li:nth-child(2){animation-delay:.08s}.steps li:nth-child(3){animation-delay:.16s}.steps li:nth-child(4){animation-delay:.24s}
.copy-btn.done{animation:pop2 .35s cubic-bezier(.34,1.56,.64,1)}

/* Guide modal */
.modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px)}
.modal.open{display:flex}
.sheet{width:100%;max-width:440px;max-height:90vh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:28px;padding:22px 20px;box-shadow:0 30px 60px rgba(0,0,0,.5);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h2{font-size:17px;display:flex;gap:8px;align-items:center}
.x{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--glass);cursor:pointer}
.x:hover{background:var(--hover)}
.steps{list-style:none;display:grid;gap:10px;counter-reset:s;margin-bottom:16px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--dim)}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#000;font-weight:800;font-size:12px;display:grid;place-items:center}
.steps b{color:var(--text)}
.code{position:relative;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;max-height:150px;overflow:auto}
:root[data-theme="light"] .code{background:rgba(0,0,0,.06)}
.code pre{font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;color:var(--text)}
.copy-btn{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#00ff96,#00b3ff);color:#000;font-weight:800;font-size:14px;cursor:pointer;transition:transform .15s,filter .2s}
.copy-btn:hover{filter:brightness(1.08)}
.copy-btn:active{transform:scale(.98)}
.copy-btn.done{background:#00ff96}
.note{font-size:11px;color:var(--dim);margin-top:10px;text-align:center}

/* Toast */
.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-150%);max-width:92%;padding:12px 18px;border-radius:16px;background:var(--bg);border:1px solid var(--line);box-shadow:0 14px 30px rgba(0,0,0,.4);font-size:13px;font-weight:700;transition:transform .4s cubic-bezier(.16,1,.3,1);z-index:50}
.toast.show{transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<main class="wrap">
  <div class="card">
    <div class="top">
      <div class="pill" id="clock">00:00</div>
      <div class="tools">
        <button class="ibtn" id="btnTheme" title="Sáng/Tối" aria-label="Đổi giao diện">🌓</button>
        <div class="lang" role="group" aria-label="Ngôn ngữ">
          <button data-lang="vi" class="on">VI</button><button data-lang="en">EN</button>
        </div>
      </div>
    </div>

    <header class="hero">
      <div class="avatar-wrap"><img class="avatar" alt="Avatar YM DEV" width="96" height="96" decoding="async"
        src="https://wsrv.nl/?url=p16-common-sign.tiktokcdn.com/tos-alisg-avt-0068/216cd451d9c92a0bc81a9dd22efb3746~tplv-tiktokx-cropcenter:1080:1080.jpeg%3Fdr%3D14579%26refresh_token%3Ddb143a48%26x-expires%3D1793358000%26x-signature%3Dga3U64k8kmuLSrX7HJQHZtupeoY%253D%26t%3D4d5b0474%26ps%3D13740610%26shp%3Da5d48078%26shcp%3D81f88b70%26idc%3Dmy2&w=200&h=200&fit=cover&output=jpg"></div>
      <div class="badge">YmdevCTE <b>✓</b></div>
      <h1>YM DEV</h1>
      <div class="sub">DEV • CHEAT • TOOL</div>
    </header>

    <div class="search">
      <span class="ico">🔍</span>
      <input id="q" type="search" autocomplete="off" data-ph="search" aria-label="Tìm kiếm">
      <kbd>Ctrl K</kbd>
    </div>
    <nav class="cats" id="cats" aria-label="Danh mục"></nav>
    <div id="list"></div>
  </div>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="gTitle">
  <div class="sheet">
    <div class="sheet-head">
      <h2><span>🚀</span><span id="gTitle"></span></h2>
      <button class="x" id="gClose" aria-label="Đóng">✕</button>
    </div>
    <ol class="steps" id="gSteps"></ol>
    <div class="code"><pre id="gCode"></pre></div>
    <button class="copy-btn" id="gCopy"></button>
    <div class="note" id="gNote"></div>
  </div>
</div>

<iframe id="scPlayer" title="Nhạc nền" allow="autoplay" tabindex="-1" aria-hidden="true"
  style="position:fixed;left:-9999px;bottom:0;width:300px;height:120px;border:0;opacity:0;pointer-events:none"></iframe>

<script>
// ===== DỮ LIỆU: thêm/sửa link tại đây, giao diện tự cập nhật =====
// url "#" = chưa có link. action "copy" = copy script.
const CATS = {
  script: { vi: 'Scripts',          en: 'Scripts' },
  exec:   { vi: 'Executor Roblox',  en: 'Roblox Executors' },
  social: { vi: 'Mạng xã hội',      en: 'Social' }
};
const ITEMS = [
  { cat:'script', ico:'🚀', c:'#ffc800', name:'Fix Lag',         vi:'Xem hướng dẫn & copy script giảm lag', en:'View guide & copy the anti-lag script', action:'copy' },
  { cat:'script', ico:'🔑', c:'#00ff96', name:'Get Key',         vi:'Lấy key sử dụng',              en:'Get your access key',      url:'#' },
  { cat:'script', ico:'🧠', c:'#ff00ff', name:'Bypass AI',       vi:'Prompt vượt bộ lọc AI',        en:'AI bypass prompt',         url:'#' },
  { cat:'script', ico:'☁️', c:'#00ced1', name:'Acc Cloud Phone', vi:'Tài khoản Cloud Phone',        en:'Cloud Phone account',      url:'#' },
  { cat:'script', ico:'🦉', c:'#58cc02', name:'Duolingo',        vi:'Công cụ Duolingo',             en:'Duolingo tool',
url:'https://greasyfork.org/vi/users/1430241-they-banning-me' },
  { cat:'script', ico:'🪟', c:'#00b3ff', name:'Window',          vi:'Công cụ Windows',              en:'Windows tool',             url:'https://link4m.net/ubzhWR' },

  { cat:'exec', ico:'🔺', c:'#00ff96', name:'Delta',    vi:'Mobile • Free • Keyless',        en:'Mobile • Free • Keyless',        url:'https://deltaexploits.gg/' },
  { cat:'exec', ico:'☀️', c:'#ffa500', name:'Solara',   vi:'PC • Free • Keyless',            en:'PC • Free • Keyless',            url:'https://wearedevs.net/e/Solara' },
  { cat:'exec', ico:'🔮', c:'#b24bff', name:'Arceus X', vi:'Mobile • Free • Keyless',        en:'Mobile • Free • Keyless',        url:'https://spdmteam.com/index' },
  { cat:'exec', ico:'📜', c:'#00b3ff', name:'Codex',    vi:'Mobile & PC • Free • Keyless',   en:'Mobile & PC • Free • Keyless',   url:'https://www.codex.lol/' },
  { cat:'exec', ico:'🎯', c:'#00ffc8', name:'Real',     vi:'PC • Free • Keyless',            en:'PC • Free • Keyless',            url:'https://projectreal.gg/' },
  { cat:'exec', ico:'🛡️', c:'#cccccc', name:'Argon',    vi:'PC • Free • Keyless',            en:'PC • Free • Keyless',            url:'https://argonexecutor.org/' },
  { cat:'exec', ico:'🍏', c:'#a2a2a2', name:'File IPA', vi:'File cài đặt cho iOS',           en:'iOS install file',               url:'#' },

  { cat:'social', ico:'🎵', c:'#ff0050', name:'TikTok',   vi:'@ym_nico_nextbot', en:'@ym_nico_nextbot', url:'https://www.tiktok.com/@ym_nico_nextbot' },
  { cat:'social', ico:'💬', c:'#5865f2', name:'Discord',  vi:'Tham gia cộng đồng', en:'Join the community', url:'https://discord.gg/yazG4EuGG' },
  { cat:'social', ico:'🐙', c:'#ffffff', name:'GitHub',   vi:'YMDEVCTE',           en:'YMDEVCTE',           url:'https://github.com/YMDEVCTE' },
  { cat:'social', ico:'🔫', c:'#ff6432', name:'Guns.lol', vi:'Trang cá nhân',      en:'Bio page',           url:'https://guns.lol/ymdev' }
];

const T = {
  vi:{ all:'Tất cả', search:'Tìm script, executor, mạng xã hội…', empty:'Không tìm thấy kết quả 😕', copied:'Đã copy Script FixLag!', copyFail:'Không copy được, thử lại.', noLink:'Link này chưa được cập nhật.', dark:'Đã chuyển sang tối', light:'Đã chuyển sang sáng', musicOn:'Đã bật nhạc', musicOff:'Đã tắt nhạc' },
  en:{ all:'All', search:'Search scripts, executors, social…', empty:'No results found 😕', copied:'FixLag script copied!', copyFail:'Copy failed, try again.', noLink:'This link is not available yet.', dark:'Dark mode', light:'Light mode', musicOn:'Music on', musicOff:'Music off' }
};
const SCRIPT_TEXT = `loadstring(game:HttpGet("https://raw.githubusercontent.com/YMDEVCTE/Script_Super_FixLag_Roblox/refs/heads/main/lol.lua"))()`;

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { return localStorage.getItem(k) || d } catch { return d } },
  set(k, v){ try { localStorage.setItem(k, v) } catch {} }
};
let lang = store.get('ym_lang', 'vi');
let cat = 'all';
let query = '';

const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ===== Toast =====
let toastTimer;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ===== Render =====
function renderCats(){
  const count = k => ITEMS.filter(i => k === 'all' || i.cat === k).length;
  const keys = ['all', ...Object.keys(CATS)];
  $('cats').innerHTML = keys.map(k =>
    `<button class="chip${k === cat ? ' on' : ''}" data-cat="${k}">${esc(k === 'all' ? T[lang].all : CATS[k][lang])}<small>${count(k)}</small></button>`
  ).join('');
}

function itemHTML(i, n){
  const tag = i.action === 'copy' ? 'button' : 'a';
  const attrs = i.action === 'copy'
    ? 'type="button" data-copy="1"'
    : `href="${i.url}"${i.url === '#' ? ' data-nolink="1"' : ' target="_blank" rel="noopener noreferrer"'}`;
  return `<${tag} class="item" ${attrs} style="--c:${i.c};--i:${n}">
    <span class="ico">${i.ico}</span>
    <span class="txt"><div class="name">${esc(i.name)}</div><div class="desc">${esc(i[lang])}</div></span>
    <span class="tag">${esc(CATS[i.cat][lang])}</span></${tag}>`;
}

function renderList(anim){
  $('list').classList.toggle('stagger', !!anim);
  const q = norm(query.trim());
  const shown = ITEMS.filter(i =>
    (cat === 'all' || i.cat === cat) &&
    (!q || norm(`${i.name} ${i.vi} ${i.en} ${CATS[i.cat].vi} ${CATS[i.cat].en}`).includes(q))
  );
  if (!shown.length){ $('list').innerHTML = `<div class="empty">${T[lang].empty}</div>`; return; }

  // Khi xem "Tất cả" và không tìm kiếm: nhóm theo danh mục
  if (cat === 'all' && !q){
    $('list').innerHTML = Object.keys(CATS).map(k => {
      const rows = shown.filter(i => i.cat === k);
      return rows.length ? `<div class="group-title">${esc(CATS[k][lang])}</div><div class="list">${rows.map(itemHTML).join('')}</div>` : '';
    }).join('');
  } else {
    $('list').innerHTML = `<div class="list">${shown.map(itemHTML).join('')}</div>`;
  }
}

function applyLang(){
  document.documentElement.lang = lang;
  $('q').placeholder = T[lang].search;
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  renderCats(); renderList(true);
}

// ===== Hướng dẫn Fix Lag =====
const GUIDE = {
  vi:{ title:'Hướng dẫn Fix Lag', copy:'📋 Copy Script', done:'✅ Đã copy!', note:'Chỉ dùng cho mục đích cá nhân. Hiệu quả tùy thiết bị và game.',
       steps:['Mở <b>executor</b> của bạn (Delta, Codex, Solara...) và vào game Roblox cần fix lag.',
              'Bấm nút <b>Copy Script</b> bên dưới để sao chép toàn bộ script.',
              'Mở tab Script trong executor, <b>dán</b> script vào ô nhập.',
              'Bấm <b>Execute</b> và chờ vài giây cho script chạy xong.'] },
  en:{ title:'Fix Lag Guide', copy:'📋 Copy Script', done:'✅ Copied!', note:'For personal use only. Results depend on your device and game.',
       steps:['Open your <b>executor</b> (Delta, Codex, Solara...) and join the Roblox game.',
              'Tap <b>Copy Script</b> below to copy the whole script.',
              'Open the Script tab in your executor and <b>paste</b> it in.',
              'Tap <b>Execute</b> and wait a few seconds for it to finish.'] }
};
let copyReset;
function openGuide(){
  const g = GUIDE[lang];
  $('gTitle').textContent = g.title;
  $('gSteps').innerHTML = g.steps.map(t => `<li><span>${t}</span></li>`).join('');
  $('gCode').textContent = SCRIPT_TEXT;
  $('gCopy').textContent = g.copy;
  $('gCopy').classList.remove('done');
  $('gNote').textContent = g.note;
  $('modal').classList.add('open');
  $('gCopy').focus();
}
function closeGuide(){ $('modal').classList.remove('open'); }

// ===== Actions =====
async function copyScript(){
  try {
    await navigator.clipboard.writeText(SCRIPT_TEXT);
    copied(true);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = SCRIPT_TEXT; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy') } catch {}
    ta.remove();
    copied(ok);
  }
}
function copied(ok){
  const b = $('gCopy');
  if (!ok){ toast(T[lang].copyFail); return; }
  toast(T[lang].copied);
  b.textContent = GUIDE[lang].done; b.classList.add('done');
  clearTimeout(copyReset);
  copyReset = setTimeout(() => { b.textContent = GUIDE[lang].copy; b.classList.remove('done'); }, 2000);
}

// ===== Events =====
$('cats').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  cat = b.dataset.cat; renderCats(); renderList(true);
});
$('list').addEventListener('click', e => {
  const el = e.target.closest('.item'); if (!el) return;
  if (el.dataset.copy){ openGuide(); }
  else if (el.dataset.nolink){ e.preventDefault(); toast(T[lang].noLink); }
});
$('gCopy').onclick = copyScript;
$('gClose').onclick = closeGuide;
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeGuide(); });
$('q').addEventListener('input', e => { query = e.target.value; renderList(); });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); $('q').focus(); $('q').select(); }
  if (e.key === 'Escape' && $('modal').classList.contains('open')){ closeGuide(); return; }
  if (e.key === 'Escape' && document.activeElement === $('q')){ $('q').value = ''; query = ''; renderList(); $('q').blur(); }
});
document.querySelector('.lang').addEventListener('click', e => {
  const b = e.target.closest('[data-lang]'); if (!b) return;
  lang = b.dataset.lang; store.set('ym_lang', lang); applyLang();
});

// Theme
function setTheme(t){
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#050508' : '#f4f4f8';
}
setTheme(store.get('ym_theme', 'dark'));
$('btnTheme').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  setTheme(next); store.set('ym_theme', next); toast(T[lang][next]);
};

// Nhạc nền: SoundCloud. Đổi bài chỉ cần sửa MUSIC_URL.
// Trình duyệt chặn autoplay có tiếng, nên nếu bị chặn thì nhạc phát ở lần chạm/bấm đầu tiên.
const MUSIC_URL = 'https://soundcloud.com/ischrishaley/crazysky-thai-hoang-x-king-von';
const MUSIC_VOLUME = 50; // 0-100
(() => {
  const frame = $('scPlayer');
  frame.src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(MUSIC_URL) +
    '&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false';
  const evs = ['pointerdown', 'keydown', 'touchstart', 'scroll'];
  let widget, ready = false, started = false;

  function tryPlay(){
    if (!ready || started) return;
    widget.isPaused(paused => { if (paused) widget.play(); });
  }
  function onGesture(){
    tryPlay();
    // dừng nghe sự kiện khi nhạc đã thật sự phát
    setTimeout(() => widget && widget.isPaused(p => { if (!p) evs.forEach(e => removeEventListener(e, onGesture, true)); }), 800);
  }
  evs.forEach(e => addEventListener(e, onGesture, { capture:true, passive:true }));

  const sc = document.createElement('script');
  sc.src = 'https://w.soundcloud.com/player/api.js';
  sc.onload = () => {
    widget = SC.Widget(frame);
    widget.bind(SC.Widget.Events.READY, () => {
      ready = true;
      widget.setVolume(MUSIC_VOLUME);
      widget.play();
    });
    widget.bind(SC.Widget.Events.PLAY, () => { started = true; widget.setVolume(MUSIC_VOLUME); });
    widget.bind(SC.Widget.Events.FINISH, () => { widget.seekTo(0); widget.play(); }); // lặp lại
  };
  document.head.appendChild(sc);
})();

// Đồng hồ: chỉ cập nhật khi tab đang hiển thị
const tick = () => { if (!document.hidden) $('clock').textContent = new Date().toLocaleTimeString('en-GB', { hour12:false }); };
tick(); setInterval(tick, 1000);

// ===== Tuyết rơi (canvas, tự dừng khi ẩn tab hoặc khi người dùng giảm chuyển động) =====
const snow = (() => {
  const cv = $('snow'), ctx = cv.getContext('2d');
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, flakes = [], on = !calm, raf = 0;
  const make = init => ({
    x: Math.random() * w, y: init ? Math.random() * h : -10,
    r: Math.random() * 2.6 + .8, v: Math.random() * .9 + .4,
    d: Math.random() * Math.PI * 2, s: Math.random() * .02 + .008, a: Math.random() * .5 + .4
  });
  function resize(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.min(120, Math.round(w / 12));
    while (flakes.length < n) flakes.push(make(true));
    flakes.length = n;
  }
  function frame(){
    ctx.clearRect(0, 0, w, h);
    const light = document.documentElement.dataset.theme === 'light';
    for (const f of flakes){
      f.d += f.s;
      f.y += f.v * (1 + f.r * .25);
      f.x += Math.sin(f.d) * .6;
      if (f.y > h + 10 || f.x < -20 || f.x > w + 20) Object.assign(f, make(false), { x: Math.random() * w });
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, 6.2832);
      ctx.fillStyle = light ? `rgba(90,140,220,${f.a})` : `rgba(255,255,255,${f.a})`;
      ctx.fill();
    }
    raf = requestAnimationFrame(frame);
  }
  function sync(){
    cancelAnimationFrame(raf);
    cv.style.display = on ? '' : 'none';
    if (on && !document.hidden) raf = requestAnimationFrame(frame);
  }
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', sync);
  resize(); sync();
})();

applyLang();
</script>
